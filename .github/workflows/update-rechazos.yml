name: Update Rechazos Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas openpyxl

      - name: Diagnóstico de conectividad Nextcloud
        env:
          NEXTCLOUD_URL: ${{ secrets.NEXTCLOUD_URL }}
          NEXTCLOUD_USERNAME: ${{ secrets.NEXTCLOUD_USERNAME }}
          NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
          NEXTCLOUD_FILE_PATH: ${{ secrets.NEXTCLOUD_FILE_PATH }}
        run: |
          NC_USER=$(echo "$NEXTCLOUD_USERNAME" | cut -d'@' -f1)
          ENCODED_PATH=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['NEXTCLOUD_FILE_PATH']))")
          echo "=== 1) Raíz con usuario corto ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -u "$NEXTCLOUD_USERNAME:$NEXTCLOUD_APP_PASSWORD" \
            "$NEXTCLOUD_URL/remote.php/dav/files/$NC_USER/" || true
          echo "=== 2) Archivo con usuario corto + encoded ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -u "$NEXTCLOUD_USERNAME:$NEXTCLOUD_APP_PASSWORD" \
            "$NEXTCLOUD_URL/remote.php/dav/files/$NC_USER$ENCODED_PATH" || true
          echo "=== 3) Raíz con usuario completo (email) ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -u "$NEXTCLOUD_USERNAME:$NEXTCLOUD_APP_PASSWORD" \
            "$NEXTCLOUD_URL/remote.php/dav/files/$NEXTCLOUD_USERNAME/" || true
          echo "=== 4) Archivo con usuario completo + encoded ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -u "$NEXTCLOUD_USERNAME:$NEXTCLOUD_APP_PASSWORD" \
            "$NEXTCLOUD_URL/remote.php/dav/files/$NEXTCLOUD_USERNAME$ENCODED_PATH" || true
          echo "=== 5) PROPFIND raíz - body completo ==="
          curl -s -X PROPFIND \
            -u "$NEXTCLOUD_USERNAME:$NEXTCLOUD_APP_PASSWORD" \
            -H "Depth: 1" \
            "$NEXTCLOUD_URL/remote.php/dav/files/$NC_USER/" | python3 -c "
import sys, re
body = sys.stdin.read()
# Buscar todos los href (paths de archivos)
hrefs = re.findall(r'<d:href>(.*?)</d:href>', body)
for h in hrefs:
    print('  HREF:', h)
" || true
          echo "=== 6) Intentar OCS direct download ==="
          curl -s -X POST \
            -u "$NEXTCLOUD_USERNAME:$NEXTCLOUD_APP_PASSWORD" \
            -H "OCS-APIREQUEST: true" \
            -H "Content-Type: application/json" \
            -d "{\"fileId\": \"$(curl -s -X PROPFIND -u \"$NEXTCLOUD_USERNAME:$NEXTCLOUD_APP_PASSWORD\" -H 'Depth: 1' \"$NEXTCLOUD_URL/remote.php/dav/files/$NC_USER/\" | python3 -c \"import sys,re; body=sys.stdin.read(); ids=re.findall(r'oc:fileid>(\\d+)<', body); print(ids[1] if len(ids)>1 else '0')\" 2>/dev/null)\"}" \
            "$NEXTCLOUD_URL/ocs/v2.php/apps/dav/api/v1/direct" 2>&1 | head -5 || true

      - name: Generar rechazos_data.json
        env:
          NEXTCLOUD_URL: ${{ secrets.NEXTCLOUD_URL }}
          NEXTCLOUD_USERNAME: ${{ secrets.NEXTCLOUD_USERNAME }}
          NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
          NEXTCLOUD_FILE_PATH: ${{ secrets.NEXTCLOUD_FILE_PATH }}
        run: python generate_rechazos_data.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rechazos_data.json
          git diff --cached --quiet || git commit -m "Auto-update rechazos_data.json [skip ci]"
          git push
