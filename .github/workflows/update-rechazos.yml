name: Update Rechazos Data

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:          # también se puede lanzar manualmente desde GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas openpyxl

      - name: Verificar conectividad a Nextcloud
        env:
          NEXTCLOUD_URL: ${{ secrets.NEXTCLOUD_URL }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$NEXTCLOUD_URL/status.php" || echo "000")
          echo "Nextcloud status.php → HTTP $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "::error::No se pudo alcanzar $NEXTCLOUD_URL (timeout). El servidor puede tener restriccion de IP."
            exit 1
          fi

      - name: Generar rechazos_data.json
        env:
          NEXTCLOUD_URL: ${{ secrets.NEXTCLOUD_URL }}
          NEXTCLOUD_USERNAME: ${{ secrets.NEXTCLOUD_USERNAME }}
          NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
          NEXTCLOUD_FILE_PATH: ${{ secrets.NEXTCLOUD_FILE_PATH }}
        run: python generate_rechazos_data.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rechazos_data.json
          git diff --cached --quiet || git commit -m "Auto-update rechazos_data.json [skip ci]"
          git push
