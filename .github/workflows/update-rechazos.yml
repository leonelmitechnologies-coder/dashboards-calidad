name: Update Rechazos Data

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:          # también se puede lanzar manualmente desde GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas openpyxl

      - name: Generar rechazos_data.json
        env:
          NEXTCLOUD_SHARE_URL: ${{ secrets.NEXTCLOUD_SHARE_URL }}
        run: python generate_rechazos_data.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rechazos_data.json
          git diff --cached --quiet || git commit -m "Auto-update rechazos_data.json [skip ci]"
          git push
